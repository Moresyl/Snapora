name: 功能建议
description: 提议新功能或改进现有体验
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: "当前遇到什么问题？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      placeholder: "你希望 Snapora 如何改进？"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: checks
    attributes:
      label: 检查项
      options:
        - label: 我确认没有提交密码、Cookie、密钥或其他敏感信息。
          required: true
